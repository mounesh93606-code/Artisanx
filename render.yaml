services:
  - type: web
    name: artisanx-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BHASHINI_USER_ID
        sync: false
      - key: BHASHINI_API_KEY
        sync: false
      - key: BHASHINI_INFERENCE_API_KEY
        sync: false
      - key: BHASHINI_PIPELINE_ENDPOINT
        value: https://dhruva-api.bhashini.gov.in/services/inference/pipeline
      - key: BHASHINI_CONFIG_ENDPOINT
        value: https://meity-auth.ulcacontrib.org/ulca/apis/v0/model/getModelsPipeline
      - key: BHASHINI_PIPELINE_ID
        sync: false
